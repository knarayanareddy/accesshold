services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: accesshold
      POSTGRES_PASSWORD: accesshold-local-only
      POSTGRES_DB: accesshold
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesshold -d accesshold"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command:
      [
        "-jar",
        "DynamoDBLocal.jar",
        "-sharedDb",
        "-dbPath",
        "./data",
        "-port",
        "8000",
      ]
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test:
        - CMD-SHELL
        - "grep -qiE ':1F40.*[[:space:]]0A([[:space:]]|$)' /proc/net/tcp /proc/net/tcp6"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://accesshold:accesshold-local-only@postgres:5432/accesshold
      ACCESSHOLD_FIXTURE_TOKEN: accesshold-local-demo-token
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_SANDBOX: "false"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/accesshold/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  dynamodb-data:
